<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财报站 · 期权策略</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1f232c; --border:#272c37;
    --txt:#e8eaed; --muted:#8b93a1; --accent:#ff7a1a;
    --up:#ff4d4f; --down:#1ec98b; --yellow:#ffb02e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5;padding-bottom:40px}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
  .topbar .brand{font-size:15px;font-weight:700;color:var(--accent);white-space:nowrap}
  .topbar .brand small{color:var(--muted);font-weight:400;font-size:11px;margin-left:6px}
  .search{margin-left:auto;display:flex;gap:8px}
  input{background:var(--card2);border:1px solid var(--border);color:var(--txt);padding:7px 12px;border-radius:8px;font-size:14px;width:120px;text-transform:uppercase}
  button{background:var(--accent);color:#1a1003;border:none;padding:7px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
  button:hover{filter:brightness(1.08)}
  .wrap{max-width:820px;margin:16px auto;padding:0 12px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
  .card h2{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:3px;height:15px;background:var(--accent);border-radius:2px;display:inline-block}
  .card h2 .en{font-size:11px;color:var(--muted);font-weight:400}
  /* overview */
  .ov{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .ov .sym{font-size:26px;font-weight:800}
  .ov .nm{color:var(--muted);font-size:13px;margin-top:2px}
  .ov .px{margin-left:auto;text-align:right}
  .ov .px .p{font-size:26px;font-weight:800}
  .ov .px .c{font-size:14px;font-weight:600}
  .ov .meta{width:100%;display:flex;gap:18px;margin-top:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}
  .ov .meta b{color:var(--txt);font-weight:600}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(255,122,26,.14);color:var(--accent);border:1px solid rgba(255,122,26,.3)}
  .tag.gray{background:var(--card2);color:var(--muted);border-color:var(--border)}
  .tag.ed{background:rgba(255,122,26,.18);color:var(--accent);border-color:rgba(255,122,26,.4);font-size:12px;padding:3px 10px}
  .ed-sess{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;color:#fff;background:var(--accent);margin-left:5px;vertical-align:2px;letter-spacing:.3px}
  .ed-block{display:flex;flex-direction:column;gap:3px}
  .ed-hint{font-size:10.5px;color:var(--muted);line-height:1.45;padding-left:2px;max-width:340px}
  /* 财报关注点 */
  .focus-list{list-style:none;display:flex;flex-direction:column;gap:10px}
  .focus-list li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.55}
  .focus-list li .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:6px}
  .focus-list li .dot.warm{background:var(--up)}
  .focus-list li .dot.cool{background:var(--down)}
  .focus-list li .dot.neutral{background:var(--muted)}
  /* 财报关注点（带来源标签） */
  .watch-list{list-style:none;display:flex;flex-direction:column;gap:8px}
  .watch-list li{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:13px;line-height:1.55;padding:9px 10px;background:var(--card2);border:1px solid var(--border);border-radius:9px}
  .watch-tag{flex:0 0 auto;display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:700}
  .watch-tag.k-inst{background:rgba(100,149,255,.15);color:#7fa3ff}
  .watch-tag.k-media{background:rgba(255,176,46,.15);color:var(--yellow)}
  .watch-tag.k-research{background:rgba(30,201,139,.15);color:var(--down)}
  .watch-text{flex:1 1 100%;color:#cdd1d8}
  .watch-src{flex:0 0 auto;font-size:11px;color:var(--muted)}
  /* 分析师近期观点 */
  table.av{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  table.av th,table.av td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)}
  table.av th{color:var(--muted);font-weight:500;font-size:11px}
  .av-act{font-weight:700}
  .av-act.bull{color:var(--down)}
  .av-act.bear{color:var(--up)}
  .av-act.flat{color:var(--muted)}
  .av-sum{font-size:12px;color:var(--muted);margin-top:6px}
  .up{color:var(--up)} .down{color:var(--down)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:500;font-size:12px}
  th:first-child,td:first-child{text-align:left}
  .badge{display:inline-block;padding:2px 9px;border-radius:7px;font-size:12px;font-weight:700}
  .badge.warm{background:rgba(255,77,79,.15);color:var(--up)}
  .badge.cool{background:rgba(30,201,139,.15);color:var(--down)}
  .badge.flat{background:var(--card2);color:var(--muted)}
  .rev-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.rev-grid{grid-template-columns:1fr}}
  .rev-box{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px}
  .rev-box .k{font-size:11px;color:var(--muted);margin-bottom:6px}
  .rev-box .v{font-size:20px;font-weight:700}
  .rev-box .s{font-size:12px;color:var(--muted);margin-top:3px}
  .ratings{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:4px 0 8px;font-size:11px}
  .ratings span{display:flex;align-items:center;justify-content:center;color:#0f1115;font-weight:700}
  .r-sb{background:#1ec98b}.r-b{background:#7ee0b8}.r-h{background:#ffb02e}.r-s{background:#ff8a5b}.r-ss{background:#ff4d4f}
  .note{font-size:12px;color:var(--muted);margin-top:12px;padding:10px 12px;background:rgba(255,122,26,.06);border:1px solid rgba(255,122,26,.18);border-radius:10px}
  .note b{color:var(--accent)}
  .loading{color:var(--muted);font-size:13px;padding:24px;text-align:center}
  .err{color:var(--up);font-size:13px;padding:14px}
  .small{font-size:11px;color:var(--muted)}
  .pill{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--card2);border:1px solid var(--border);color:var(--muted);margin-left:6px}
  .strat{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:13px;font-size:13px;line-height:1.7}
  .strat .h{font-weight:700;color:var(--accent);margin-bottom:6px}
  .strat-ctrl{display:flex;gap:10px;margin:6px 0 2px;flex-wrap:wrap}
  .strat-ctrl select{background:var(--card2);border:1px solid var(--border);color:var(--txt);padding:6px 10px;border-radius:8px;font-size:13px}
  .strat-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
  @media(max-width:560px){.strat-metrics{grid-template-columns:repeat(2,1fr)}}
  .strat-metrics .m{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:9px 11px}
  .strat-metrics .m span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  .strat-metrics .m b{font-size:17px;font-weight:700}
  table.legs{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0 4px}
  table.legs th,table.legs td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--border)}
  table.legs th{color:var(--muted);font-weight:500;font-size:12px}
  table.legs th:first-child,table.legs td:first-child{text-align:left}
  .badge2{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:700}
  .badge2.sell{background:rgba(255,77,79,.16);color:var(--up)}
  .badge2.buy{background:rgba(30,201,139,.16);color:var(--down)}
  .badge2.hold{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
  .leg-line{font-size:13px;color:var(--txt);margin:10px 0 2px;line-height:1.6}
  .leg-line .t{color:var(--accent);font-weight:700}
  .leg-net{font-size:13px;margin-top:6px;color:var(--muted)}
  .leg-net b{font-size:15px;color:var(--txt)}
  /* 历史财报日价格反应 */
  .er-sub{font-size:13px;font-weight:700;color:var(--txt);margin:14px 0 6px;display:flex;align-items:center;gap:8px}
  .er-sub::before{content:"";width:3px;height:13px;background:var(--accent);border-radius:2px;display:inline-block}
  .er-sub .en{font-size:11px;color:var(--muted);font-weight:400}
  .er-legend{display:flex;gap:16px;font-size:11px;color:var(--muted);margin:6px 0}
  .er-legend span{display:flex;align-items:center;gap:5px}
  .er-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
  /* 分析师多空汇总块 */
  .ab-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
  .ab-box{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px;text-align:center}
  .ab-box .n{font-size:22px;font-weight:800}
  .ab-box .l{font-size:11px;color:var(--muted);margin-top:2px}
  .ab-box.bull .n{color:var(--down)} .ab-box.bear .n{color:var(--up)} .ab-box.flat .n{color:var(--muted)}
  .ab-rate{font-size:13px;color:var(--muted);margin:4px 0 2px}
  .ab-rate b{color:var(--txt)}
  /* 分析师观点摘要 */
  .av-summary{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;margin:10px 0}
  .av-summary .t{font-size:12px;font-weight:700;color:var(--txt);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .av-summary .t::before{content:"";width:3px;height:12px;background:var(--accent);border-radius:2px;display:inline-block}
  .av-summary ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .av-summary li{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.6;color:#cdd1d8}
  .av-summary li .dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px}
  .av-summary .src{font-size:11px;color:var(--muted);margin-top:8px;text-align:right}
  /* 富途式财报前瞻 */
  .fc-hero{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}
  .fc-hero .head{display:grid;grid-template-columns:1fr 140px 100px;background:var(--card2);padding:7px 12px;color:var(--muted);font-size:11px}
  .fc-kpi{display:grid;grid-template-columns:1fr 140px 100px;padding:8px 12px;border-top:1px solid var(--border);font-size:13px;align-items:center}
  .fc-kpi:first-of-type{border-top:0}.fc-kpi b{text-align:right}.fc-kpi .y{text-align:right;font-weight:800}
  .fc-tabs{display:flex;gap:7px;margin:6px 0 10px}.fc-tab{background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:7px;font-size:11px}
  .fc-tab.active{background:rgba(255,122,26,.12);border-color:var(--accent);color:var(--accent)}
  .fc-chart{width:100%;height:190px;display:block}.fc-chart-note{font-size:10px;color:var(--muted);margin-top:5px}
  .fc-legend{display:flex;justify-content:center;gap:18px;color:var(--muted);font-size:10px;margin-top:2px}.fc-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
  @media(max-width:560px){.fc-hero .head,.fc-kpi{grid-template-columns:1fr 100px 70px}.fc-chart{height:170px}}
  /* 未来一个月重要财报日历 */
  .cal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
  .cal-head .small{max-width:520px}
  .cal-list{display:flex;flex-direction:column;gap:8px}
  .cal-day{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:start;padding:9px 0;border-top:1px solid var(--border)}
  .cal-day:first-child{border-top:0}
  .cal-date{font-size:12px;font-weight:700;color:var(--txt);padding-top:5px}
  .cal-date span{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-top:1px}
  .cal-tickers{display:flex;flex-wrap:wrap;gap:7px}
  .cal-chip{appearance:none;background:var(--card2);border:1px solid var(--border);color:var(--txt);padding:5px 9px;border-radius:8px;font-size:12px;line-height:1.2;cursor:pointer;font-weight:650}
  .cal-chip:hover,.cal-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(255,122,26,.08);filter:none}
  .cal-chip em{display:block;font-style:normal;font-size:9px;color:var(--muted);font-weight:400;margin-top:2px}
  @media(max-width:560px){.cal-day{grid-template-columns:1fr}.cal-date{padding-top:0}.cal-date span{display:inline;margin-left:6px}}
</style>

  } else if (u.includes('/api/history')) {
    data = bucket.history || {ok:false, error:'无历史快照'};
  } else {
    data = bucket.earnings || {ok:false, error:'无财报快照'};
  }
  return { ok:true, json: async () => data };
};
</script>
</head>

  </div>
</div>

<script>
let lastSymbol=null;
let curStrategy='short_straddle';
let curExpiration=null;
let fcMetric='revenue';
let currentEarningsData=null;

const EARNINGS_CALENDAR=[
  {date:'2026-09-08',session:'盘后',symbols:[['GME','GameStop']]},
  {date:'2026-09-10',session:'盘后',symbols:[['ADBE','Adobe'],['ORCL','Oracle']]}
];

function renderCalendar(){
  const box=document.getElementById('cal-card');
  if(!box) return;
  let h='<div class="cal-head"><div><h2>未来一个月重要财报 <span class="en">2026-09-07 — 2026-10-08</span></h2><div class="small">点击标的即可切换完整财报预测、历史反应、分析师观点与期权策略。时间为预计口径，可能调整。</div></div></div><div class="cal-list">';
  EARNINGS_CALENDAR.forEach(function(day){
    h+='<div class="cal-day"><div class="cal-date">'+day.date.slice(5).replace('-','/')+'<span>'+day.session+'</span></div><div class="cal-tickers">';
    day.symbols.forEach(function(item){
      const active=item[0]===lastSymbol?' active':'';
      h+='<button class="cal-chip'+active+'" onclick="selectSymbol(\''+item[0]+'\')">'+item[0]+'<em>'+item[1]+'</em></button>';
    });
    h+='</div></div>';
  });
  box.innerHTML=h+'</div>';
}

function selectSymbol(sym){
  document.getElementById('symbol').value=sym;
  curStrategy='short_straddle';
  curExpiration=null;
  load();
  window.scrollTo({top:document.getElementById('ov-card').offsetTop-72,behavior:'smooth'});
}

async function load(){
  const sym=document.getElementById('symbol').value.trim().toUpperCase();
  if(!sym) return;
  lastSymbol=sym;
  renderCalendar();
  await loadEarnings(sym);
  await loadAnalyst(sym);
  await loadHistory(sym);
  await loadStrategy();
}

// 打开页面默认加载日历中最近一场财报的首只标的，不再固定 WMT。
// EARNINGS_CALENDAR 已按日期、时段和优先级排序，因此首项就是当前滚动窗口的最近财报。
function loadNearestEarnings(){
  const firstDay=EARNINGS_CALENDAR.find(day=>day.symbols&&day.symbols.length);
  const firstSymbol=firstDay&&firstDay.symbols[0]&&firstDay.symbols[0][0];
  if(firstSymbol){
    document.getElementById('symbol').value=firstSymbol;
    load();
  }else{
    renderCalendar();
  }
}
document.addEventListener('DOMContentLoaded', loadNearestEarnings);

function fmt(v){ return (v===undefined||v===null||v==='?'||v==='')?'—':v; }
function signCls(s){ if(s==null) return ''; s=String(s); return s.startsWith('-')?'down':'up'; }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function loadEarnings(sym){
  const ids=['ov-card','fc-card','rev-card','hist-card','rate-card','val-card'];
  ids.forEach(id=>document.getElementById(id).innerHTML='<div class="loading">加载中…</div>');
  try{
    const r=await fetch('/api/earnings?symbol='+sym);
    const d=await r.json();
    if(!d.ok){ ids.forEach(id=>document.getElementById(id).innerHTML='<div class="err">❌ '+esc(d.error)+'</div>'); return; }
    renderOverview(d);
    renderForecast(d);
    renderRevision(d);
    renderHistory(d);
    renderFocus(d);
    renderRatings(d);
    renderValuation(d);
  }catch(e){ ids.forEach(id=>document.getElementById(id).innerHTML='<div class="err">❌ '+esc(e)+'</div>'); }
}

async function loadAnalyst(sym){
  let box=document.getElementById('analyst-views');
  if(!box) return;
  box.innerHTML='<div class="small">分析师近期观点加载中…</div>';
  try{
    const r=await fetch('/api/analyst?symbol='+encodeURIComponent(sym));
    const d=await r.json();
    if(!d.ok){ box.innerHTML='<div class="small">❌ '+esc(d.error)+'</div>'; return; }
    renderAnalystViews(d);
  }catch(e){ box.innerHTML='<div class="small">❌ '+esc(e)+'</div>'; }
}

function renderOverview(d){
  const up = !(String(d.market_change||'').startsWith('-'));
  const cls = d.market_change==null?'':(up?'up':'down');
  let ed='—', session='', sessionNote='';
  if(d.earnings_date) { try{ ed=new Date(d.earnings_date*1000).toISOString().slice(0,10); }catch(e){ ed=fmt(d.earnings_date);} }
  // 从日历查盘前/盘后（EARNINGS_CALENDAR 是按美东日期标注的）
  if(ed && ed!=='—'){
    for(const day of EARNINGS_CALENDAR){
      if(day.date===ed && day.symbols.some(x=>x[0]===d.symbol)){
        session = day.session;
        break;
      }
    }
  }
  if(session==='盘前') sessionNote='<div class="ed-hint">美东当日 06:00–08:00 盘前发布（北京时间前一日晚 / 当日早）</div>';
  else if(session==='盘后') sessionNote='<div class="ed-hint">美东当日 16:00–20:00 盘后发布（北京时间次日清晨）</div>';
  document.getElementById('ov-card').innerHTML =
    '<h2>概览 <span class="en">Overview</span></h2>'+
    '<div class="ov">'+
      '<div><div class="sym">'+esc(d.symbol)+'</div><div class="nm">'+esc(d.name||'')+'</div></div>'+
      '<div class="px"><div class="p">'+fmt(d.market_price)+'</div><div class="c '+cls+'">'+(d.market_change==null?'':(up?'+':'')+fmt(d.market_change))+'</div></div>'+
      '<div class="meta">'+
        '<div class="ed-block">'+
          '<span class="tag ed">📅 预计财报日 <b>'+ed+'</b>'+(session?(' <span class="ed-sess">'+session+'</span>'):'')+'</span>'+
          sessionNote+
        '</div>'+
        '<span><span class="tag">财报预测</span></span>'+
      '</div>'+
    '</div>';
}

function numFmt(v,metric,currency){
  if(v==null) return '—';
  if(metric==='revenue'){
    const unit=currency==='CNY'?'亿元':'亿';
    return (Number(v)/1e8).toFixed(2)+unit;
  }
  return Number(v).toFixed(2);
}
function quarterLabel(p){
  if(!p) return '—';
  const y=String(p).slice(0,4),m=Number(String(p).slice(5,7));
  return y+'/Q'+Math.max(1,Math.ceil(m/3));
}
function setForecastMetric(metric){ fcMetric=metric; if(currentEarningsData) renderForecast(currentEarningsData); }
function buildForecastSvg(d,metric){
  const src=(d.forecast_chart||{})[metric]||{};
  const actual=(src.actual||[]).filter(x=>x.value!=null);
  const forecastRaw=(src.forecast||[]).filter(x=>x.value!=null);
  // 历史当时共识预测（EPS 有 estimate；营收无该字段则自动为空，仅显示未来预测）
  const histEst=(src.actual||[]).filter(x=>x.estimate!=null);
  // 预测序列 = 历史当时共识预测 + 未来一致预期，连成一条虚线
  const predPts=histEst.concat(forecastRaw);
  const pts=actual.concat(forecastRaw);
  if(!pts.length) return '<div class="small">暂无趋势数据</div>';
  const W=760,H=190,L=42,R=20,T=24,B=36;
  const vals=pts.map(x=>Number(x.value)); let mn=Math.min(...vals),mx=Math.max(...vals); if(mx===mn){mx+=1;mn-=1;} const extra=(mx-mn)*.18;mn-=extra;mx+=extra;
  // x 轴位置数 = 实际点数 + 未来预测点数（历史预测与实际共用季度 x）
  const N=Math.max(1,actual.length+forecastRaw.length-1);
  const x=i=>L+i*(W-L-R)/N, y=v=>T+(mx-v)*(H-T-B)/(mx-mn);
  // 实际路径：i=0..actual.length-1
  const actualPath=actual.map((p,i)=>((i?'L':'M')+x(i).toFixed(1)+' '+y(Number(p.value)).toFixed(1))).join(' ');
  // 预测路径：历史预测段取 p.estimate（当时共识），未来预测段取 p.value（当前一致预期）
  const predPath=predPts.map((p,j)=>{
    const xi=j<histEst.length?j:actual.length+(j-histEst.length);
    const v=j<histEst.length?p.estimate:p.value;
    return (j?'L':'M')+x(xi).toFixed(1)+' '+y(Number(v)).toFixed(1);
  }).join(' ');
  let svg='<svg class="fc-chart" viewBox="0 0 '+W+' '+H+'" role="img">';
  svg+='<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="#343945" stroke-width="1"/>';
  if(actualPath) svg+='<path d="'+actualPath+'" fill="none" stroke="#6495ff" stroke-width="2"/>';
  if(predPath) svg+='<path d="'+predPath+'" fill="none" stroke="#ff7a1a" stroke-width="2" stroke-dasharray="5 4"/>';
  // 实际点：蓝色实心圆
  actual.forEach(function(p,i){
    const tx=x(i),ty=y(Number(p.value));
    svg+='<circle cx="'+tx+'" cy="'+ty+'" r="3.5" fill="#6495ff"/>';
  });
  // 预测点：橙色空心圈（历史预测段取 estimate，未来段取 value）
  predPts.forEach(function(p,j){
    const isHist=j<histEst.length;
    const xi=isHist?j:actual.length+(j-histEst.length);
    const v=isHist?p.estimate:p.value;
    const tx=x(xi),ty=y(Number(v));
    svg+='<circle cx="'+tx+'" cy="'+ty+'" r="3.5" fill="#0f1115" stroke="#ff7a1a" stroke-width="2"/>';
  });
  const fmtNum=v=>numFmt(v,metric,(d.forecast_chart||{}).currency);
  // 预测季度标签：从实际最后财季递增（4Q2026 → 1Q2027 → 2Q2027）
  const lastActualLabel=actual.length?String(actual[actual.length-1].label||''):'';
  const fcLabelOf=function(k){
    const m=lastActualLabel.match(/^(\d)Q(\d{4})$/);
    if(m){ let q=Number(m[1])+k+1, y=Number(m[2]); while(q>4){ q-=4; y+=1; } return y+'/Q'+q; }
    return (forecastRaw[k]&&forecastRaw[k].date)?quarterLabel(forecastRaw[k].date):'—';
  };
  // 实际值标签：数字在点的正上方，季度在底部
  actual.forEach(function(p,i){
    const tx=x(i),ty=y(Number(p.value));
    svg+='<text x="'+tx+'" y="'+Math.max(12,ty-10)+'" text-anchor="middle" fill="#6495ff" font-size="10">'+esc(fmtNum(p.value))+'</text>';
    svg+='<text x="'+tx+'" y="'+(H-14)+'" text-anchor="middle" fill="#8b93a1" font-size="9">'+esc(p.label||quarterLabel(p.date))+'</text>';
  });
  // 预测值标签：数字在点的正下方（历史预测与实际同 x，垂向错开）；未来预测补画季度标签
  predPts.forEach(function(p,j){
    const isHist=j<histEst.length;
    const xi=isHist?j:actual.length+(j-histEst.length);
    const v=isHist?p.estimate:p.value;
    const tx=x(xi),ty=y(Number(v));
    svg+='<text x="'+tx+'" y="'+Math.min(H-B-4,ty+18)+'" text-anchor="middle" fill="#ff7a1a" font-size="10">'+esc(fmtNum(v))+'</text>';
    if(!isHist) svg+='<text x="'+tx+'" y="'+(H-14)+'" text-anchor="middle" fill="#8b93a1" font-size="9">'+esc(fcLabelOf(j-histEst.length))+'</text>';
  });
  return svg+'</svg><div class="fc-legend"><span><i style="background:#6495ff"></i>实际值</span><span><i style="background:transparent;border:2px solid #ff7a1a;border-radius:50%"></i>预测值</span></div>';
}
function renderForecast(d){
  currentEarningsData=d;
  const q=(d.quarterly||[])[0]||{};
  let h='<h2>财报前瞻 <span class="en">Earnings Forecast</span></h2>';
  h+='<div class="small" style="margin:-7px 0 10px">预期值为当前分析师一致预期；实际值与预测段分色展示。单位：'+esc(((d.forecast_chart||{}).currency)||'—')+'</div>';
  h+='<div class="fc-hero"><div class="head"><span></span><span style="text-align:right">预测值</span><span style="text-align:right">同比</span></div>'+
    '<div class="fc-kpi"><span>营收</span><b>'+fmt(q.revenue)+'</b><span class="y '+signCls(q.growth)+'">'+fmt(q.growth)+'</span></div>'+
    '<div class="fc-kpi"><span>每股收益</span><b>'+fmt(q.eps)+'</b><span class="y '+signCls(q.eps_growth)+'">'+fmt(q.eps_growth)+'</span></div></div>';
  h+='<div class="small" style="font-weight:700;color:var(--txt);margin-bottom:7px">财务预测</div><div class="fc-tabs">'+
    '<button class="fc-tab '+(fcMetric==='revenue'?'active':'')+'" onclick="setForecastMetric(\'revenue\')">营业收入</button>'+
    '<button class="fc-tab '+(fcMetric==='eps'?'active':'')+'" onclick="setForecastMetric(\'eps\')">每股收益</button></div>';
  h+=buildForecastSvg(d,fcMetric);
  h+='<div class="fc-chart-note">蓝色实线为已披露实际值；橙色虚线为预测值——历史季度来自公布当季的分析师共识，未来季度为当前一致预期。同季度实虚两点距离越大，当时 miss/beat 越明显。营收历史段无共识数据（公开接口不含），仅 EPS 视图有历史预测线。</div>';
  document.getElementById('fc-card').innerHTML=h;
}

function renderRevision(d){
  const r=d.revision;
  if(!r){ document.getElementById('rev-card').innerHTML='<h2>预期修订 <span class="en">Estimate Revision</span></h2><div class="small">无数据</div>'; return; }
  const badge = r.direction==='升温'?'<span class="badge warm">▲ 升温</span>'
    : (r.direction==='降温'?'<span class="badge cool">▼ 降温</span>':'<span class="badge flat">—</span>');
  document.getElementById('rev-card').innerHTML=
    '<h2>预期修订 <span class="en">Estimate Revision '+badge+'</span></h2>'+
    '<div class="rev-grid">'+
      '<div class="rev-box"><div class="k">当前 EPS 预期</div><div class="v">'+fmt(r.current)+'</div><div class="s">30日前 '+fmt(r.d30)+' · 7日前 '+fmt(r.d7)+'</div></div>'+
      '<div class="rev-box"><div class="k">近7日 上调/下调</div><div class="v up">'+fmt(r.up7)+' <span class="down">/ '+fmt(r.down7)+'</span></div><div class="s">分析师修订家数</div></div>'+
      '<div class="rev-box"><div class="k">近30日 上调/下调</div><div class="v up">'+fmt(r.up30)+' <span class="down">/ '+fmt(r.down30)+'</span></div><div class="s">预期走向信号</div></div>'+
      '<div class="rev-box"><div class="k">判断</div><div class="v">'+fmt(r.direction)+'</div><div class="s">上调<下调 → 预期降温</div></div>'+
    '</div>';
}

function renderHistory(d){
  if(!d.history||!d.history.length){ document.getElementById('hist-card').innerHTML='<h2>历史业绩 <span class="en">Actual vs Estimate</span></h2><div class="small">无数据</div>'; return; }
  let h='<h2>历史业绩 <span class="en">Actual vs Estimate (Surprise)</span></h2>';
  h+='<table><thead><tr><th>季度</th><th>实际EPS</th><th>预期EPS</th><th>Surprise</th></tr></thead><tbody>';
  d.history.forEach(x=>{
    let s=x.surprise||''; let cls=signCls(s);
    let beat = (x.actual!=null&&x.estimate!=null)?(x.actual>=x.estimate?'beat':'miss'):'';
    h+='<tr><td>'+fmt(x.quarter)+'</td><td>'+fmt(x.actual)+'</td><td>'+fmt(x.estimate)+'</td><td class="'+cls+'">'+fmt(s)+(beat?' '+(beat==='beat'?'✅':'❌'):'')+'</td></tr>';
  });
  h+='</tbody></table>';
  document.getElementById('hist-card').innerHTML=h;
}

function renderFocus(d){
  const watch=d.watch||[];
  const arr=d.focus||[];
  let h='<h2>财报关注点 <span class="en">What to Watch</span></h2>';
  if(watch.length){
    h+='<div class="small" style="margin:-7px 0 10px">综合最近一个月机构观点、主流媒体报道及内部研报库关注点，来源与日期已标注。</div><ul class="watch-list">';
    watch.forEach(function(w){
      const kindCls = w.kind==='机构'?'k-inst':(w.kind==='媒体'?'k-media':'k-research');
      h+='<li><span class="watch-tag '+kindCls+'">'+esc(w.kind)+'</span>'+
         '<span class="watch-src">'+esc(w.source||'')+(w.date?' · '+esc(w.date):'')+'</span>'+
         '<span class="watch-text">'+esc(w.text)+'</span></li>';
    });
    h+='</ul>';
  }
  else if(arr.length){
    h+='<ul class="focus-list">';
    arr.forEach(function(t){
      let cls='neutral';
      if(/(降温|风险|miss|不及预期|偏饱满)/.test(t)) cls='warm';
      else if(/(升温|超预期|上行空间|延续)/.test(t)) cls='cool';
      h+='<li><span class="dot '+cls+'"></span><span>'+esc(t)+'</span></li>';
    });
    h+='</ul>';
  }
  else{ h+='<div class="small">暂无可用关注点</div>'; }
  document.getElementById('focus-card').innerHTML=h;
}

function renderRatings(d){
  const r=d.ratings;
  if(!r){ document.getElementById('rate-card').innerHTML='<h2>分析师评级 <span class="en">Ratings & Views</span></h2><div class="small">无数据</div>'; return; }
  const tot=(r.strongBuy+r.buy+r.hold+r.sell+r.strongSell)||1;
  // 历史 EPS 超预期率（对应 「超预期 X%」）
  let beatHtml='';
  const hist=d.history||[];
  let beats=0, total=0;
  hist.forEach(x=>{ if(x.actual!=null && x.estimate!=null){ total++; if(x.actual>=x.estimate) beats++; } });
  if(total>0){
    const rate=(beats/total*100).toFixed(0);
    beatHtml='<div class="ab-rate">历史 EPS <b>超预期率 '+rate+'%</b>（近 '+total+' 季 '+beats+' 次 beat / '+(total-beats)+' 次 miss）</div>';
  }
  document.getElementById('rate-card').innerHTML=
    '<h2>分析师评级 <span class="en">Ratings & Views</span></h2>'+
    '<div class="ratings">'+
      '<span class="r-sb" style="width:'+(r.strongBuy/tot*100)+'%">'+r.strongBuy+'</span>'+
      '<span class="r-b" style="width:'+(r.buy/tot*100)+'%">'+r.buy+'</span>'+
      '<span class="r-h" style="width:'+(r.hold/tot*100)+'%">'+r.hold+'</span>'+
      '<span class="r-s" style="width:'+(r.sell/tot*100)+'%">'+r.sell+'</span>'+
      '<span class="r-ss" style="width:'+(r.strongSell/tot*100)+'%">'+r.strongSell+'</span>'+
    '</div>'+
    '<div class="small">强买 '+r.strongBuy+' · 买入 '+r.buy+' · 持有 '+r.hold+' · 卖出 '+r.sell+' · 强卖 '+r.strongSell+'</div>'+
    beatHtml +
    '<div id="analyst-views"></div>';
}

function renderAnalystViews(d){
  const views=d.views||[];
  let up=0,down=0,flat=0;
  views.forEach(function(v){ if(v.bull>0)up++; else if(v.bull<0)down++; else flat++; });
  let h='<div class="ab-sum">'+
    '<div class="ab-box bull"><div class="n">'+up+'</div><div class="l">看多</div></div>'+
    '<div class="ab-box bear"><div class="n">'+down+'</div><div class="l">看空</div></div>'+
    '<div class="ab-box flat"><div class="n">'+flat+'</div><div class="l">中性</div></div>'+
  '</div>';
  // 观点摘要
  const summary=d.summary||[];

// 通用横向柱状图（支持正负值，涨红跌绿）
function buildBarSvg(items, opts){
  // items: [{label, val, color}]  val 为百分比数值
  opts=opts||{};
  const W=720,H=opts.H||260,padL=10,padR=10,padT=20,padB=opts.labelH||52;
  const plotH=H-padT-padB;
  const n=items.length;
  const gap=14, bw=Math.min(72,(W-padL-padR-gap*(n-1))/n);
  const totalW=(bw+gap)*n-gap;
  const x0=(W-totalW)/2;
  let vmax=0.1, vmin=0;
  items.forEach(it=>{ if(it.val>vmax)vmax=it.val; if(it.val<vmin)vmin=it.val; });
  const span=(vmax-vmin)||1;
  function Y(v){ return padT + (vmax-v)/(vmax-vmin)*plotH; }
  function Xc(i){ return x0 + i*(bw+gap) + bw/2; }
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;margin:6px 0">';
  // 零轴
  const y0=Y(0);
  svg+='<line x1="'+padL+'" y1="'+y0.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y0.toFixed(1)+'" stroke="#8b93a1" stroke-width="1"/>';
  items.forEach((it,i)=>{
    const xc=Xc(i);
    const yv=Y(it.val);
    const x=xc-bw/2;
    const h=Math.abs(yv-y0);
    const y=Math.min(yv,y0);
    const col=it.color || (it.val>=0?'#ff4d4f':'#1ec98b');
    svg+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+col+'" opacity="0.85"/>';
    // 柱顶数值：正向放柱子上方；负向先尝试放柱子下方，若会压到 X 轴标签则改为柱内白色
    let lblY = it.val>=0 ? (y-7) : (y+h+13);
    let lblFill = col;
    if(it.val>=0 && lblY < padT+3){
      lblY = y+13; lblFill='#ffffff';
    }
    if(it.val<0 && lblY+10 > H-padB){
      lblY = y+h-12; lblFill='#ffffff';
    }
    svg+='<text x="'+xc.toFixed(1)+'" y="'+lblY.toFixed(1)+'" fill="'+lblFill+'" font-size="11" font-weight="700" text-anchor="middle">'+(it.val>=0?'+':'')+it.val.toFixed(2)+'%</text>';
    // X 标签（两行：日期 + surprise），下移避免与柱贴太近
    const ly=H-padB+15;
    svg+='<text x="'+xc.toFixed(1)+'" y="'+ly.toFixed(1)+'" fill="#8b93a1" font-size="10" text-anchor="middle">'+esc(it.label)+'</text>';
    if(it.sub){ svg+='<text x="'+xc.toFixed(1)+'" y="'+(ly+14).toFixed(1)+'" fill="#8b93a1" font-size="9" text-anchor="middle">'+esc(it.sub)+'</text>'; }
  });
  svg+='</svg>';
  return svg;
}

function buildCandleSvg(win){
  if(!win||!win.length) return '<div class="small">无 K 线数据</div>';
  const W=720, H=240, padL=8, padR=8, padT=22, padB= 28;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  let mx=-1e9, mn=1e9;
  win.forEach(function(k){ if(k.high&&k.high>mx)mx=k.high; if(k.low&&k.low<mn)mn=k.low; });
  if(mx<=mn){ mx=mn+1; mn=mn-1; }
  mx=mx*1.02; mn=mn*0.98;
  const n=win.length, step=plotW/n, cw=Math.min(13, step*0.62);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg" style="max-width:100%">';
  for(let g=0; g<=2; g++){
    const val=mn+(mx-mn)*g/2;
    const y=padT+(mx-val)/(mx-mn)*plotH;
    s+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="#888" stroke-opacity="0.18" stroke-width="1"/>';
  }
  win.forEach(function(k,i){
    const cx=padL+(i+0.5)*step;
    const up=k.close>=k.open;
    const col=up?'#ff4d4f':'#1ec98b';
    const yO=padT+(mx-k.open)/(mx-mn)*plotH;
    const yC=padT+(mx-k.close)/(mx-mn)*plotH;
    const yH=padT+(mx-k.high)/(mx-mn)*plotH;
    const yL=padT+(mx-k.low)/(mx-mn)*plotH;
    const top=Math.min(yO,yC), bot=Math.max(yO,yC);
    s+='<line x1="'+cx.toFixed(1)+'" y1="'+yH.toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+yL.toFixed(1)+'" stroke="'+col+'" stroke-width="1"/>';
    s+='<rect x="'+(cx-cw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+Math.max(1,(bot-top)).toFixed(1)+'" fill="'+col+'"/>';
    if(k.is_event){
      s+='<rect x="'+((cx-step/2)+2).toFixed(1)+'" y="'+padT+'" width="'+(step-4).toFixed(1)+'" height="'+plotH+'" fill="#ff4d4f" fill-opacity="0.10"/>';
      s+='<text x="'+cx.toFixed(1)+'" y="'+(padT-7)+'" text-anchor="middle" font-size="10" fill="#ff4d4f">财报日</text>';
    }
    const dd=k.date.slice(5);
    s+='<text x="'+cx.toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="9" fill="#888">'+dd+'</text>';
  });
  s+='</svg>';
  return s;
}

function buildPnlSvg(d){
  // 富途式极简盈亏图：矮而宽，只保留曲线、平衡点与现价。
  var W=1000,H=150,padL=8,padR=8,padT=24,padB=12;
  var plotW=W-padL-padR,plotH=H-padT-padB;
  var curve=d.curve; if(!curve||!curve.length) return '';
  var sMin=curve[0].s,sMax=curve[curve.length-1].s;
  var pMin=0,pMax=0;
  curve.forEach(function(p){ if(p.pnl<pMin)pMin=p.pnl; if(p.pnl>pMax)pMax=p.pnl; });
  var range=(pMax-pMin)||1;
  pMax+=range*0.18;
  pMin-=range*0.12;
  function X(s){ return padL+(s-sMin)/(sMax-sMin)*plotW; }
  function Y(p){ return padT+(pMax-p)/(pMax-pMin)*plotH; }
  var y0=Y(0);
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;margin:10px 0 6px">';

  // 盈利区淡红、亏损区淡绿（美股页面沿用红涨绿跌的当前产品口径）。
  svg+='<rect x="'+padL+'" y="'+padT+'" width="'+plotW+'" height="'+Math.max(0,y0-padT).toFixed(1)+'" fill="#ff4d4f" opacity="0.065"/>';
  svg+='<rect x="'+padL+'" y="'+y0.toFixed(1)+'" width="'+plotW+'" height="'+Math.max(0,padT+plotH-y0).toFixed(1)+'" fill="#1ec98b" opacity="0.075"/>';
  svg+='<line x1="'+padL+'" y1="'+y0.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y0.toFixed(1)+'" stroke="#aeb4bf" stroke-width="0.8" opacity="0.55"/>';

  // 平衡点：橙色细虚线，价格贴近曲线交点，不再放 BP 文本框。
  (d.breakevens||[]).forEach(function(be){
    if(be<sMin||be>sMax) return;
    var xb=X(be);
    svg+='<line x1="'+xb.toFixed(1)+'" y1="'+padT+'" x2="'+xb.toFixed(1)+'" y2="'+(padT+plotH)+'" stroke="#ffb02e" stroke-width="1" stroke-dasharray="3 3" opacity="0.9"/>';
    svg+='<circle cx="'+xb.toFixed(1)+'" cy="'+y0.toFixed(1)+'" r="2.5" fill="#668cff"/>';
    svg+='<text x="'+xb.toFixed(1)+'" y="'+(y0-6).toFixed(1)+'" fill="#667085" font-size="10" text-anchor="middle">'+be.toFixed(2)+'</text>';
  });

  // 曲线按每一小段中点盈亏着色；跨越零轴时拆段，避免交界处错色。
  for(var i=1;i<curve.length;i++){
    var a=curve[i-1],b=curve[i];
    if((a.pnl<0&&b.pnl>0)||(a.pnl>0&&b.pnl<0)){
      var t=(0-a.pnl)/(b.pnl-a.pnl);
      var crossS=a.s+(b.s-a.s)*t;
      var colA=a.pnl>=0?'#ff5b6e':'#20b889';
      var colB=b.pnl>=0?'#ff5b6e':'#20b889';
      svg+='<line x1="'+X(a.s).toFixed(1)+'" y1="'+Y(a.pnl).toFixed(1)+'" x2="'+X(crossS).toFixed(1)+'" y2="'+y0.toFixed(1)+'" stroke="'+colA+'" stroke-width="2"/>';
      svg+='<line x1="'+X(crossS).toFixed(1)+'" y1="'+y0.toFixed(1)+'" x2="'+X(b.s).toFixed(1)+'" y2="'+Y(b.pnl).toFixed(1)+'" stroke="'+colB+'" stroke-width="2"/>';
    }else{
      var col=((a.pnl+b.pnl)/2)>=0?'#ff5b6e':'#20b889';
      svg+='<line x1="'+X(a.s).toFixed(1)+'" y1="'+Y(a.pnl).toFixed(1)+'" x2="'+X(b.s).toFixed(1)+'" y2="'+Y(b.pnl).toFixed(1)+'" stroke="'+col+'" stroke-width="2"/>';
    }
  }

  // 现价只显示一条中性虚线和一个顶部标签；最大盈利已在下方指标卡展示。
  if(d.underlying>=sMin&&d.underlying<=sMax){
    var xc=X(d.underlying);
    svg+='<line x1="'+xc.toFixed(1)+'" y1="'+padT+'" x2="'+xc.toFixed(1)+'" y2="'+(padT+plotH)+'" stroke="#7e8794" stroke-width="1" stroke-dasharray="3 3" opacity="0.9"/>';
    svg+='<text x="'+xc.toFixed(1)+'" y="14" fill="#4b5563" font-size="10" text-anchor="middle">标的价格 '+d.underlying.toFixed(2)+'</text>';
  }
  svg+='</svg>';
  return svg;
}

document.getElementById('symbol').addEventListener('keydown',e=>{ if(e.key==='Enter') load(); });
window.addEventListener('DOMContentLoaded', ()=>{ load(); });
</script>
</body>
</html>
