<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>美股模拟盘 · 策略聚合</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{--bg:#1a1a2e;--panel:#22223c;--line:#2f2f50;--txt:#e8e8f0;--mut:#9a9ab8;
--up:#26d07c;--down:#ff5a6a;--gold:#ffc857;--blue:#4aa3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif}
.wrap{max-width:1680px;margin:0 auto;padding:22px 26px 40px}
h1{font-size:21px;margin:0 0 4px;letter-spacing:.3px}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:14px;line-height:1.7}
.warn{display:inline-block;background:rgba(255,200,87,.12);border:1px solid rgba(255,200,87,.35);
color:var(--gold);padding:3px 9px;border-radius:5px;font-size:11.5px;margin-right:8px}
.tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{background:transparent;color:var(--mut);border:1px solid var(--line);border-bottom:none;
padding:9px 20px;border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;margin-bottom:-1px}
.tab.on{color:var(--txt);background:var(--panel);border-color:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 15px}
.card .k{color:var(--mut);font-size:11.5px;margin-bottom:6px}
.card .v{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
.card .v.pos{color:var(--up)} .card .v.neg{color:var(--down)}
#chart-col,#chart-colf,#chart-eg,#chart-qb{width:100%;height:min(58vh,520px);background:var(--panel);border:1px solid var(--line);border-radius:10px}
#dd-col,#dd-colf,#dd-eg,#dd-qb{width:100%;height:170px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-top:14px}
.panel h2{font-size:15.5px;margin:0 0 10px}
.note{color:var(--mut);font-size:12px;margin-top:10px;line-height:1.7}
.tbox{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:9px}
table{width:100%;border-collapse:collapse;font-size:12.2px}
thead th{position:sticky;top:0;background:#26264a;color:var(--mut);font-weight:600;
text-align:right;padding:9px 11px;white-space:nowrap;z-index:2}
thead th:nth-child(-n+5){text-align:left}
tbody td{padding:7px 11px;text-align:right;border-bottom:1px solid #2a2a4a;
white-space:nowrap;font-variant-numeric:tabular-nums}
tbody td:nth-child(-n+5){text-align:left}
tbody tr:hover{background:#26264a}
.pos{color:var(--up)} .neg{color:var(--down)}
.ph{display:flex;align-items:center;justify-content:center;height:min(50vh,420px);
flex-direction:column;gap:10px;color:var(--mut);font-size:15px}
.ph .big{font-size:40px;color:var(--gold)}
footer{color:var(--mut);font-size:11.5px;margin-top:22px;line-height:1.8}
.subsel{display:flex;gap:8px;margin-bottom:12px}
.sb{background:var(--panel);color:var(--mut);border:1px solid var(--line);border-radius:7px;
padding:6px 16px;cursor:pointer;font-size:13px}
.sb.on{color:var(--txt);background:#2e2e52;border-color:#4a4a7a}
.hint{color:var(--mut);font-size:11.5px;font-weight:400}
tr.rw{cursor:pointer}
tr.rw td:first-child::before{content:'\25B8 ';color:var(--mut)}
tr.rw.open td:first-child::before{content:'\25BE ';color:var(--gold)}
tr.dt td.dcell{background:#1f1f38;border-bottom:1px solid var(--line);padding:11px 14px}
.chip{display:inline-block;background:#2a2a4a;border:1px solid var(--line);border-radius:5px;
padding:3px 8px;margin:3px 4px;font-size:11.5px;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="wrap">
  <h1>美股模拟盘 · 策略聚合</h1>
  <div class="sub"><span class="warn">模拟交易，仅供策略研究，不构成投资建议</span>
  五个模拟策略共用同一套本地数据（warehouse.duckdb / daily_kline），各自独立回测。</div>

  <div class="tabs">
    <button class="tab on" data-t="col">选股栏目</button>
    <button class="tab" data-t="colf">选股栏目（基本面版）</button>
    <button class="tab" data-t="eg">净利润断层</button>
    <button class="tab" data-t="qb">季度平衡</button>
    <button class="tab" data-t="qv">量化价值（QV）</button>
  </div>

  <div id="panel-col"></div>
  <div id="panel-colf" style="display:none"></div>
  <div id="panel-eg" style="display:none"></div>
  <div id="panel-qb" style="display:none"></div>
  <div id="panel-qv" style="display:none"></div>

  <footer>模拟交易，仅供策略研究，不构成投资建议。所有成交均为模拟撮合，不涉及真实资金。<br/>
  数据：warehouse.duckdb（daily_kline + screener_results + eg.duckdb）。公网：
  <a href="https://yueling-buddy.github.io/us-stock-portal/" style="color:#7b8cff">us-stock-portal</a></footer>
</div>

function renderKPIs(el, kpis){
  el.innerHTML = '<div class="cards">' + kpis.map(k=>
    `<div class="card"><div class="k">${k[0]}</div><div class="v ${k[2]}">${k[1]}</div></div>`
  ).join('') + '</div>';
}

function renderNav(elId, dates, series){
  const chart = getChart(elId);
  chart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis', valueFormatter:v=>v==null?'-':(+v).toFixed(3)},
    legend:{data:series.map(s=>s.name), textStyle:{color:'#cfd2e0'}, top:0},
    grid:{left:48,right:18,top:36,bottom:28},
    xAxis:{type:'category', data:dates, axisLabel:{color:'#8a8db0', fontSize:10},
            axisLine:{lineStyle:{color:'#3a3a5c'}}},
    yAxis:{type:'value', scale:true, axisLabel:{color:'#8a8db0', fontSize:10},
            splitLine:{lineStyle:{color:'#2a2a44'}}},
    series:series.map(s=>({name:s.name, type:'line', showSymbol:false,
            lineStyle:{width:2.2, color:s.color}, itemStyle:{color:s.color},
            data:s.data}))
  }, true);
  return chart;
}

function renderDD(elId, dates, navs){
  const v = navs[0].data;
  let peak=v[0], dd=v.map(x=>{ if(x>peak)peak=x; return +(x/peak-1)*100; });
  const chart = getChart(elId);
  chart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis', valueFormatter:v=>v==null?'-':(+v).toFixed(2)+'%'},
    grid:{left:48,right:18,top:14,bottom:24},
    xAxis:{type:'category', data:dates, axisLabel:{color:'#8a8db0', fontSize:9},
            axisLine:{lineStyle:{color:'#3a3a5c'}}},
    yAxis:{type:'value', axisLabel:{color:'#8a8db0', fontSize:10, formatter:'{value}%'},
            splitLine:{lineStyle:{color:'#2a2a44'}}},
    series:[{type:'line', showSymbol:false, lineStyle:{width:0},
            areaStyle:{color:'rgba(255,90,106,.35)'}, itemStyle:{color:'#ff5a6a'},
            data:dd, markLine:{silent:true, data:[{yAxis:0}], lineStyle:{color:'#444'}}}]
  }, true);
  return chart;
}

function renderTable(el, table){
  const head = '<thead><tr>'+table.cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead>';
  const body = '<tbody>'+table.rows.map(r=>'<tr>'+r.map(c=>{
      let cls=''; const s=String(c);
      if(s.startsWith('+')) cls='pos'; else if(s.startsWith('-')&&s!=='-') cls='neg';
      return `<td class="${cls}">${c}</td>`;
    }).join('')+'</tr>').join('')+'</tbody>';
  el.innerHTML = `<div class="tbox"><table>${head}${body}</table></div>`;
}

function renderColTable(el, table, prefix){
  const head = '<thead><tr>'+table.cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead>';
  let body='<tbody>';
  // 最新档期置顶；保留原下标以正确关联每期持仓明细
  const order = table.rows.map((_,idx)=>idx).sort((a,b)=>String(table.rows[b][0]).localeCompare(String(table.rows[a][0])));
  order.forEach(idx=>{
    const r = table.rows[idx];
    body += `<tr class="rw" data-i="${idx}">`+r.map(c=>{
        let cls=''; const s=String(c);
        if(s.startsWith('+')) cls='pos'; else if(s.startsWith('-')&&s!=='-') cls='neg';
        return `<td class="${cls}">${c}</td>`;
      }).join('')+'</tr>';
    const holds = table.holdings[idx]||[];
    const chips = holds.map(h=>`<span class="chip ${h[1].startsWith('+')?'pos':'neg'}">${h[0]} ${h[1]}</span>`).join('');
    body += `<tr class="dt" id="dt-${prefix}-${idx}" style="display:none"><td colspan="${table.cols.length}" class="dcell">`
          + `本期组合（${holds.length} 只）｜ 点击行收起：<br/>${chips}</td></tr>`;
  });
  body+='</tbody>';
  el.innerHTML = `<div class="tbox"><table>${head}${body}</table></div>`;
  el.querySelectorAll('tr.rw').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      const i=tr.dataset.i;
      const dt=document.getElementById('dt-'+prefix+'-'+i);
      const open = dt.style.display==='none';
      dt.style.display = open ? 'table-row' : 'none';
      tr.classList.toggle('open', open);
    });
  });
}

function renderSensHTML(sens){
  const rows = sens.map(s=>`
    <tr><td>${s.n}</td>
      <td class="${s.total>=0?'pos':'neg'}">${(s.total*100).toFixed(1)}%</td>
      <td class="${s.cagr>=0?'pos':'neg'}">${(s.cagr*100).toFixed(1)}%</td>
      <td class="neg">${(s.dd*100).toFixed(1)}%</td>
      <td>${s.sharpe.toFixed(2)}</td>
      <td>${(s.wwr*100).toFixed(1)}%</td>
      <td>${(s.iwr*100).toFixed(1)}%</td>
      <td class="${s.excess>=0?'pos':'neg'}">${(s.excess*100).toFixed(1)}%</td></tr>`).join('');
  return `<h2>选股数量敏感性（等权·周频再平衡） <span class="hint">Top5 弹性最大、回撤最猛；越宽越平滑，全池风险调整后最优</span></h2>`
    + `<div class="tbox"><table><thead><tr><th>选股数</th><th>总收益</th><th>年化</th><th>最大回撤</th>`
    + `<th>夏普</th><th>周胜率</th><th>个股综合胜率</th><th>超额QQQ</th></tr></thead>`
    + `<tbody>${rows}</tbody></table></div>`;
}

function renderCurrentHold(prefix, cur){
  const el = document.getElementById('cur-'+prefix);
  if(!cur) { el.innerHTML=''; return; }
  const labels = {5:'Top5', 10:'Top10', 99999:'全池'};
  let html = `<h2>当前持仓 · 最新一期（${cur.date} 建仓 · 在途未平仓）</h2>`
    + `<div class="sub" style="margin:0 0 10px">以下为最新一期选股（${cur.date} 周四收盘建仓），计划持有至下周四再平衡；`
    + `括号内为截至 <b>${cur.asof}</b> 的部分收益（未平仓，非最终业绩，仅反映建仓以来浮盈/浮亏）。</div>`;
  [5,10,99999].forEach(n=>{
    const picks = cur.boards[n] || [];
    const chips = picks.map(p=>{
      const ret = p[1];
      if(ret===null || ret===undefined) return `<span class="chip">${p[0]} —</span>`;
      const cls = ret>=0 ? 'pos' : 'neg';
      return `<span class="chip ${cls}">${p[0]} ${(ret*100).toFixed(1)}%</span>`;
    }).join('');
    html += `<div style="margin:9px 0"><b>${labels[n]}</b>（${picks.length} 只）： ${chips}</div>`;
  });
  el.innerHTML = html;
}

function renderColTab(brdKey, prefix, dataKey){
  const col = DATA[dataKey];
  const b = col.boards[brdKey];
  renderKPIs(document.getElementById('kpis-'+prefix), b.kpis);
  const series = [
    {name:'栏目'+b.label, color:'#ffc857', data:b.nav},
    {name:'QQQ', color:'#26d07c', data:col.bench.qqq},
    {name:'SPY', color:'#4aa3ff', data:col.bench.spy},
  ];
  charts[prefix+'_nav'] = renderNav('chart-'+prefix, col.dates, series);
  charts[prefix+'_dd']  = renderDD('dd-'+prefix, col.dates, [{data:b.nav}]);
  renderColTable(document.getElementById('tbl-'+prefix), b.table, prefix);
  document.querySelectorAll('#'+prefix+'-sub .sb').forEach(btn=>btn.classList.toggle('on', btn.dataset.k===brdKey));
}

function renderTab(key){
  const d = DATA[key];
  const panel = document.getElementById('panel-'+key);
  if(d.placeholder){
    panel.innerHTML = `<div class="panel"><h2>${d.title}</h2>
      <div class="ph"><div class="big">\u23F3</div><div>预留选项卡 · 待接入</div></div>
      <div class="note">${d.note}</div></div>`;
    return;
  }
  if(key==='col' || key==='colf'){
    const prefix = (key==='col') ? 'col' : 'colf';
    const curKey = (key==='col') ? curBoard : curBoardColf;
    panel.innerHTML = `
      <div class="sub"><span class="warn">模拟盘</span>${d.asof}</div>
      <div id="${prefix}-sub" class="subsel">
        <button class="sb on" data-k="top5">Top5</button>
        <button class="sb" data-k="top10">Top10</button>
        <button class="sb" data-k="full">全池</button>
      </div>
      <div id="kpis-${prefix}"></div>
      <div id="chart-${prefix}"></div>
      <div id="dd-${prefix}"></div>
      <div class="panel" id="cur-${prefix}"></div>
      <div class="panel"><h2>逐期调仓明细 <span class="hint">（最新档期在前；点击任一行展开该档期组合持仓）</span></h2>
        <div id="tbl-${prefix}"></div></div>
      <div class="panel" id="sens-${prefix}"></div>
      <div class="note">${d.note}</div>`;
    document.querySelectorAll('#'+prefix+'-sub .sb').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(prefix==='col') curBoard=btn.dataset.k; else curBoardColf=btn.dataset.k;
        renderColTab(btn.dataset.k, prefix, key);
      });
    });
    renderColTab(curKey, prefix, key);
    if(d.current) renderCurrentHold(prefix, d.current);
    if(d.sens) document.getElementById('sens-'+prefix).innerHTML = renderSensHTML(d.sens);
    return;
  }
  // eg / qb 标准渲染
  panel.innerHTML = `
    <div class="sub"><span class="warn">模拟盘</span>${d.asof}</div>
    <div id="kpis-${key}"></div>
    <div id="chart-${key}"></div>
    <div id="dd-${key}"></div>
    <div class="panel"><h2>明细</h2><div id="tbl-${key}"></div></div>
    <div class="note">${d.note}</div>`;
  renderKPIs(document.getElementById('kpis-'+key), d.kpis);
  charts[key+'_nav'] = renderNav('chart-'+key, d.dates, d.series);
  charts[key+'_dd']  = renderDD('dd-'+key, d.dates, d.series);
  renderTable(document.getElementById('tbl-'+key), d.table);
}

function showTab(key){
  ['col','colf','eg','qb','qv'].forEach(k=>{
    document.getElementById('panel-'+k).style.display = (k===key)?'block':'none';
    const btn = document.querySelector('.tab[data-t="'+k+'"]');
    if(btn) btn.classList.toggle('on', k===key);
  });
  renderTab(key);
  if(charts[key+'_nav']) charts[key+'_nav'].resize();
  if(charts[key+'_dd']) charts[key+'_dd'].resize();
}

document.querySelectorAll('.tab').forEach(b=>{
  b.addEventListener('click', ()=>showTab(b.dataset.t));
});
window.addEventListener('resize', ()=>{ Object.values(charts).forEach(c=>c&&c.resize()); });
showTab('col');
</script>
</body></html>
