function show(e,i){

  let x=(e.touches?e.touches[0].clientX:e.clientX)+12, y=(e.touches?e.touches[0].clientY:e.clientY)+12;

}
function hide(){box.style.display='none';}
document.querySelectorAll('.hit').forEach(c=>{
  const i=+c.dataset.i;
  c.addEventListener('mousemove',e=>show(e,i));
  c.addEventListener('mouseleave',hide);
  c.addEventListener('touchstart',e=>show(e,i),{passive:true});
});
document.addEventListener('touchstart',e=>{if(!e.target.classList.contains('hit'))hide();},{passive:true});
