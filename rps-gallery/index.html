<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美股个股 RPS 画廊</title>
<style>
 *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
 body{background:#f7f8fa;color:#1f2329;padding:16px;max-width:1100px;margin:0 auto;}
 h1{font-size:20px;margin-bottom:4px;}
 .sub{color:#8a9099;font-size:12px;margin-bottom:4px;}
 .refresh-ts{color:#8a9099;font-size:11px;margin-bottom:12px;}
 .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
 .stat{background:#fff;border:1px solid #e6e8eb;border-radius:8px;padding:8px 14px;}
 .stat .n{font-size:20px;font-weight:700;}
 .stat .l{font-size:11px;color:#8a9099;}
 .toolbar{display:flex;gap:10px;margin-bottom:10px;align-items:center;flex-wrap:wrap;}
 .toolbar input{padding:7px 10px;border:1px solid #d8dce0;border-radius:8px;font-size:13px;min-width:200px;}
 .toolbar select{padding:7px 10px;border:1px solid #d8dce0;border-radius:8px;font-size:13px;}
 .toolbar button{background:#fff;border:1px solid #d8dce0;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;}
 .toolbar button:hover{background:#eef1f4;}
 .tblwrap{background:#fff;border:1px solid #e6e8eb;border-radius:10px;overflow:auto;max-height:78vh;}
 table{width:100%;border-collapse:collapse;}
 th,td{padding:9px 10px;text-align:right;font-size:13px;border-bottom:1px solid #f0f1f3;white-space:nowrap;}
 th{background:#fafbfc;color:#5b6168;cursor:pointer;user-select:none;position:sticky;top:0;z-index:1;}
 th:hover{color:#2d7ff9;}
 td.tk{text-align:left;font-weight:700;}
 a{color:#2d7ff9;text-decoration:none;}
 a:hover{text-decoration:underline;}
 tr:hover{background:#f7faff;}
 .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;}
 .tag.bo{background:#e6f4ea;color:#1e7e34;}
 .tag.cup{background:#fff4e5;color:#b26a00;}
 .tag.none{background:#f1f2f4;color:#9aa0a6;}
 .tag.pp{background:#e3f2fd;color:#1565c0;}
 .tag.bb{background:#fde7e9;color:#c62828;}
 .pos{color:#26a69a;} .neg{color:#ef5350;}
 .foot{color:#9aa0a6;font-size:11px;margin-top:12px;line-height:1.6;}

  .pager{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .pager button{padding:6px 12px;border:1px solid #d8dce0;border-radius:8px;background:#fff;font-size:13px;cursor:pointer;}
  .pager button:hover:not(:disabled){background:#eef1f4;}
  .pager button:disabled{color:#c4c8cc;cursor:default;}
  .pager .pginfo{font-size:12px;color:#5b6168;}
  .pager .pgnum{font-size:12px;color:#5b6168;}
  .pager input{padding:6px 8px;border:1px solid #d8dce0;border-radius:8px;font-size:13px;}
</style>
</head>
<body>
 <h1>美股个股 RPS 画廊</h1>
 <div class="sub" id="sub"></div>
 <div class="refresh-ts">行情时间：2026-08-22 04:00（北京时间 · 对应最新交易日收盘）</div>
 <div class="stats" id="stats"><div class="stat"><div class="n">1</div><div class="l">全部</div></div><div class="stat"><div class="n">0</div><div class="l">杯柄形态</div></div><div class="stat"><div class="n">0</div><div class="l">杯柄突破</div></div><div class="stat"><div class="n">0</div><div class="l">口袋支点</div></div><div class="stat"><div class="n">0</div><div class="l">基底突破</div></div></div>
 <div class="toolbar">
   <input id="q" placeholder="搜索代码…">
   <select id="fcup">
     <option value="">全部</option>
     <option value="cup">杯柄形态</option>
     <option value="bo">杯柄突破</option>
     <option value="pp">口袋支点</option>
     <option value="bb">基底突破</option>
   </select>
   <button id="reset">重置排序/筛选</button>
 </div>
 <div class="tblwrap">
 <table id="tbl">
   <thead><tr>
     <th data-k="t">代码</th><th data-k="c">末价</th>
     <th data-k="r">综合RPS</th><th data-k="y">1Y</th><th data-k="m">6M</th><th data-k="q">3M</th>
     <th data-k="cup">杯柄</th>
     <th data-k="pp">口袋支点</th>
     <th data-k="bb">基底突破</th>
   </tr></thead>
   <tbody id="tbody"></tbody>
 </table>
 </div>
 <div class="pager" id="pager"></div>
 <div class="foot">综合RPS = 0.4×RPS(3M)+0.3×RPS(6M)+0.3×RPS(1Y)，全宇宙百分位排名（与选股器同口径）。绿涨红跌·美股习惯。点击代码在新标签打开个股图。杯柄识别为实验性规则，仅供可视化提示，不构成任何操作建议。</div>
<script>
 const DATA = [{"t": "DFAI", "d": "DFAI", "c": 43.35, "r": 60.8, "y": 67.3, "m": 58.2, "q": 57.9, "cup": null, "bo": false, "pp": false, "bb": false}];
  let pageSize=100, page=0;
 const META = {"label": "全部", "mainrps": true};
 const subEl=document.getElementById('sub');
 const tbody=document.getElementById('tbody');
 const qEl=document.getElementById('q');
 const fcup=document.getElementById('fcup');
 subEl.textContent='共 '+DATA.length+' 只 · 显示窗口 '+META.label+(META.mainrps?' · 副图RPS':'');
 let sortKey='r', sortDir=-1;
 function cupTag(r){
   if(r.bo) return '<span class="tag bo">突破</span>';
   if(r.cup) return '<span class="tag cup">'+(r.cup==='rising'?'杯柄·上升':'杯柄·经典')+'</span>';
   return '<span class="tag none">—</span>';
 }
 function sigTag(v,txt,cls){return v?'<span class="tag '+cls+'">'+txt+'</span>':'<span class="tag none">—</span>';}
 function fmt(v){return v==null?'—':v.toFixed(1);}
 function rpsCls(v){return v==null?'':(v>=80?'pos':(v<30?'neg':''));}
 function render(){
   const q=qEl.value.trim().toUpperCase();
   const fc=fcup.value;
   let list=DATA.filter(r=>{
     if(q && !r.t.includes(q)) return false;
     if(fc==='cup' && !r.cup) return false;
     if(fc==='bo' && !r.bo) return false;
     if(fc==='pp' && !r.pp) return false;
     if(fc==='bb' && !r.bb) return false;
     return true;
   });
   list.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];if(x==null)x=-1e9;if(y==null)y=-1e9;return (x-y)*sortDir;});
   const total=list.length;const pages=Math.max(1,Math.ceil(total/pageSize));if(page>=pages)page=pages-1;if(page<0)page=0;const start=page*pageSize;const view=list.slice(start,start+pageSize);tbody.innerHTML=view.map(r=>(
     '<tr><td class="tk"><a href="charts/'+r.d+'/index.html" target="_blank">'+r.t+'</a></td>'+
     '<td>'+(r.c==null?'—':'$'+r.c.toFixed(2))+'</td>'+
     '<td class="'+rpsCls(r.r)+'">'+fmt(r.r)+'</td>'+
     '<td class="'+rpsCls(r.y)+'">'+fmt(r.y)+'</td>'+
     '<td class="'+rpsCls(r.m)+'">'+fmt(r.m)+'</td>'+
     '<td class="'+rpsCls(r.q)+'">'+fmt(r.q)+'</td>'+
     '<td>'+cupTag(r)+'</td>'+
     '<td>'+sigTag(r.pp,'口袋支点','pp')+'</td>'+
     '<td>'+sigTag(r.bb,'基底突破','bb')+'</td></tr>'
   )).join('');
  renderPager(total,pages,start,view.length);
 }
 document.querySelectorAll('th').forEach(th=>{
   th.addEventListener('click',()=>{
     const k=th.dataset.k;
     if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=(k==='t')?1:-1;}
     page=0;render();
   });
 });
 qEl.addEventListener('input',()=>{page=0;render();});
 fcup.addEventListener('change',()=>{page=0;render();});
 document.getElementById('reset').addEventListener('click',()=>{sortKey='r';sortDir=-1;qEl.value='';fcup.value='';page=0;render();});
 page=0;render();

  function renderPager(total,pages,start,shown){
    const pager=document.getElementById('pager');
    if(total===0){pager.innerHTML='';return;}
    let html='<span class="pginfo">显示 '+(start+1)+'–'+(start+shown)+' / 共 '+total+' 只</span>';
    html+='<button id="pgprev" '+(page<=0?'disabled':'')+'>‹ 上一页</button>';
    html+='<span class="pgnum">第 '+(page+1)+' / '+pages+' 页</span>';
    html+='<button id="pgnext" '+(page>=pages-1?'disabled':'')+'>下一页 ›</button>';
    html+='<input id="pgjump" type="number" min="1" max="'+pages+'" placeholder="页码" style="width:64px;">';
    html+='<button id="pggo">跳转</button>';
    pager.innerHTML=html;
    document.getElementById('pgprev').onclick=()=>{if(page>0){page--;render();}};
    document.getElementById('pgnext').onclick=()=>{if(page<pages-1){page++;render();}};
    document.getElementById('pggo').onclick=()=>{const v=parseInt(document.getElementById('pgjump').value,10);if(!isNaN(v)&&v>=1&&v<=pages){page=v-1;render();}};
  }

</script>
</body></html>
