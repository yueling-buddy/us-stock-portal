   });
   list.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];if(x==null)x=-1e9;if(y==null)y=-1e9;return (x-y)*sortDir;});
   const total=list.length;const pages=Math.max(1,Math.ceil(total/pageSize));if(page>=pages)page=pages-1;if(page<0)page=0;const start=page*pageSize;const view=list.slice(start,start+pageSize);tbody.innerHTML=view.map(r=>(
     '<tr><td class="tk"><a href="charts/'+r.d+'/index.html" target="_blank">'+r.t+'</a></td>'+
     '<td>'+(r.c==null?'—':'$'+r.c.toFixed(2))+'</td>'+
     '<td class="'+rpsCls(r.r)+'">'+fmt(r.r)+'</td>'+
     '<td class="'+rpsCls(r.y)+'">'+fmt(r.y)+'</td>'+
     '<td class="'+rpsCls(r.m)+'">'+fmt(r.m)+'</td>'+
     '<td class="'+rpsCls(r.q)+'">'+fmt(r.q)+'</td>'+
     '<td>'+cupTag(r)+'</td>'+
     '<td>'+sigTag(r.pp,'口袋支点','pp')+'</td>'+
     '<td>'+sigTag(r.bb,'基底突破','bb')+'</td></tr>'
   )).join('');
  renderPager(total,pages,start,view.length);
 }
 document.querySelectorAll('th').forEach(th=>{
   th.addEventListener('click',()=>{
     const k=th.dataset.k;
     if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=(k==='t')?1:-1;}
     page=0;render();
   });
 });
 qEl.addEventListener('input',()=>{page=0;render();});
 fcup.addEventListener('change',()=>{page=0;render();});
 document.getElementById('reset').addEventListener('click',()=>{sortKey='r';sortDir=-1;qEl.value='';fcup.value='';page=0;render();});
 page=0;render();

  function renderPager(total,pages,start,shown){
    const pager=document.getElementById('pager');
    if(total===0){pager.innerHTML='';return;}
    let html='<span class="pginfo">显示 '+(start+1)+'–'+(start+shown)+' / 共 '+total+' 只</span>';
    html+='<button id="pgprev" '+(page<=0?'disabled':'')+'>‹ 上一页</button>';
    html+='<span class="pgnum">第 '+(page+1)+' / '+pages+' 页</span>';
    html+='<button id="pgnext" '+(page>=pages-1?'disabled':'')+'>下一页 ›</button>';
    html+='<input id="pgjump" type="number" min="1" max="'+pages+'" placeholder="页码" style="width:64px;">';
    html+='<button id="pggo">跳转</button>';
    pager.innerHTML=html;
    document.getElementById('pgprev').onclick=()=>{if(page>0){page--;render();}};
    document.getElementById('pgnext').onclick=()=>{if(page<pages-1){page++;render();}};
    document.getElementById('pggo').onclick=()=>{const v=parseInt(document.getElementById('pgjump').value,10);if(!isNaN(v)&&v>=1&&v<=pages){page=v-1;render();}};
  }

</script>
</body></html>
